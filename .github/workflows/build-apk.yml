name: Build installable APK

# Run it from: GitHub -> Actions -> "Build installable APK" -> Run workflow
on:
  workflow_dispatch:
    inputs:
      arch:
        description: "CPU architecture (almost every modern phone is arm64-v8a)"
        required: true
        default: arm64-v8a
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86_64
          - x86
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ARCH: ${{ github.event.inputs.arch || 'arm64-v8a' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools (JDK, Rust, NDK, cargo-ndk)
        uses: ./.github/actions/install-android-build-tools
        with:
          cache: "true"
          arch: ${{ env.ARCH }}

      # Debug builds are signed automatically with the Android debug key,
      # so the APK can be installed directly on a phone (release builds are unsigned).
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          cap="$(echo "${ARCH:0:1}" | tr '[:lower:]' '[:upper:]')${ARCH:1}"
          ./gradlew "assemble${cap}Debug" --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p build-output
          find android/app/build/outputs/apk -name '*.apk' -exec cp {} build-output/ \;
          ls -lh build-output

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openscq30-soundcore-ui-${{ env.ARCH }}
          path: build-output/*.apk
          if-no-files-found: error
